version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: crypto_tsdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crypto}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-crypto_dashboard}
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crypto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-crypto}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-crypto_dashboard}
      REDIS_URL: redis://redis:6379
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      COINGLASS_API_KEY: ${COINGLASS_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      DERIBIT_CLIENT_ID: ${DERIBIT_CLIENT_ID:-}
      CRYPTOQUANT_API_KEY: ${CRYPTOQUANT_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/app/config

volumes:
  tsdb_data:
